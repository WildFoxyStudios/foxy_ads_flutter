name: foxy_ads
description: "Foxy Ads - Tu plataforma de clasificados con temática de zorro"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  carousel_slider: ^5.0.0
  
  # Supabase
  supabase_flutter: ^2.8.1
  
  # Auth
  google_sign_in: ^7.2.0
  
  # State Management
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^4.0.3
  
  # Navigation
  go_router: ^17.0.0
  
  # Utils
  intl: ^0.20.2
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  flutter_dotenv: ^6.0.0
  
  # Local Storage
  shared_preferences: ^2.3.3
  
  # Payments (Google Pay for Android)
  pay: ^3.0.0
  firebase_core: ^4.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.4
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.3

# Pin path_provider_android to 2.2.x — the 2.3.x release pulls in the new
# `jni` / `jni_flutter` plugins whose Android module is missing the
# `JniPlugin.java` / `JniFlutterPlugin.java` source files (they live in
# `android/src/main/java` but the build.gradle references
# `../java/src/main/java`), causing a `package does not exist` failure in
# `GeneratedPluginRegistrant.java` at compile time. 2.2.x uses the old
# `io.flutter.plugins.pathprovider.PathProviderPlugin` path and ships cleanly.
#
# Pinned to a single concrete version because pub picks the max version
# that satisfies every constraint — `^2.2.23` won't override a transitive
# `^2.3.0` pin.
dependency_overrides:
  path_provider_android: 2.2.23

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#FF6B35"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"

flutter:
  uses-material-design: true
  generate: true
  
  assets:
    - assets/images/
    - assets/icons/
    - .env
